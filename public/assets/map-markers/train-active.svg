<!-- map-markers/train-active.svg — active train position marker -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 20" role="img" aria-label="Active train">
  <defs>
    <filter id="glow-a">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Train body -->
  <rect x="2" y="4" width="28" height="12" rx="3" fill="#22c55e" filter="url(#glow-a)"/>
  <!-- Nose -->
  <path d="M30 5 L34 10 L30 15 Z" fill="#16a34a"/>
  <!-- Windows -->
  <rect x="5"  y="6.5" width="5" height="5" rx="1" fill="#fff" fill-opacity="0.8"/>
  <rect x="13" y="6.5" width="5" height="5" rx="1" fill="#fff" fill-opacity="0.8"/>
  <rect x="21" y="6.5" width="5" height="5" rx="1" fill="#fff" fill-opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="9"  cy="17" r="2" fill="#15803d" stroke="#bbf7d0" stroke-width="0.8"/>
  <circle cx="24" cy="17" r="2" fill="#15803d" stroke="#bbf7d0" stroke-width="0.8"/>
</svg>
