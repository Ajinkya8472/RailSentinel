<!-- map-markers/crowd-hotspot.svg — purple crowd hotspot marker -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Crowd hotspot">
  <circle cx="16" cy="16" r="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="9"  fill="#a855f7" fill-opacity="0.35"/>
  <circle cx="16" cy="16" r="4"  fill="#a855f7"/>
  <!-- Pulse animation -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="r" values="10;16;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
