<!-- illustrations/empty-state.svg — generic empty state illustration -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="No data illustration">
  <defs>
    <linearGradient id="sky-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="url(#sky-g)" rx="12"/>

  <!-- Tracks -->
  <line x1="20"  y1="160" x2="260" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="20"  y1="167" x2="260" y2="167" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="36"  y1="157" x2="36"  y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="64"  y1="157" x2="64"  y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="92"  y1="157" x2="92"  y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="120" y1="157" x2="120" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="148" y1="157" x2="148" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="176" y1="157" x2="176" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="204" y1="157" x2="204" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="232" y1="157" x2="232" y2="170" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Empty train (ghost) -->
  <rect x="80" y="118" width="120" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <path d="M200 120 L210 137 L200 154 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="88"  y="124" width="14" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="110" y="124" width="14" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="132" y="124" width="14" height="10" rx="2" fill="#e2e8f0"/>
  <rect x="154" y="124" width="14" height="10" rx="2" fill="#e2e8f0"/>
  <circle cx="100" cy="158" r="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="170" cy="158" r="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Question mark -->
  <text x="140" y="145" font-family="'Inter',system-ui,sans-serif" font-size="22" font-weight="700"
        fill="#94a3b8" text-anchor="middle">?</text>

  <!-- Cloud doodles -->
  <ellipse cx="50"  cy="60" rx="22" ry="12" fill="#e0f2fe" fill-opacity="0.8"/>
  <ellipse cx="65"  cy="55" rx="18" ry="11" fill="#e0f2fe" fill-opacity="0.8"/>
  <ellipse cx="78"  cy="62" rx="16" ry="9"  fill="#e0f2fe" fill-opacity="0.8"/>
  <ellipse cx="200" cy="50" rx="20" ry="11" fill="#e0f2fe" fill-opacity="0.6"/>
  <ellipse cx="218" cy="45" rx="16" ry="9"  fill="#e0f2fe" fill-opacity="0.6"/>

  <!-- Label -->
  <text x="140" y="188" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="500"
        fill="#94a3b8" text-anchor="middle" letter-spacing="1">NO DATA AVAILABLE</text>
</svg>
