<!-- illustrations/error-state.svg — error / connection failure illustration -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="Error state illustration">
  <defs>
    <linearGradient id="err-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <rect width="280" height="200" fill="url(#err-g)" rx="12"/>

  <!-- Broken tracks -->
  <line x1="20"  y1="160" x2="115" y2="160" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
  <line x1="20"  y1="167" x2="115" y2="167" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="160" x2="260" y2="160" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="167" x2="260" y2="167" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
  <!-- Break gap marker -->
  <path d="M120 154 L130 170 M135 154 L125 170" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Train (stopped) -->
  <rect x="50" y="120" width="100" height="36" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <path d="M150 122 L158 138 L150 154 Z" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="57"  y="126" width="12" height="8" rx="1.5" fill="#fca5a5"/>
  <rect x="74"  y="126" width="12" height="8" rx="1.5" fill="#fca5a5"/>
  <rect x="91"  y="126" width="12" height="8" rx="1.5" fill="#fca5a5"/>
  <rect x="108" y="126" width="12" height="8" rx="1.5" fill="#fca5a5"/>
  <circle cx="70"  cy="158" r="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>
  <circle cx="130" cy="158" r="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>

  <!-- Alert triangle above train -->
  <path d="M100 80 L118 108 L82 108 Z" fill="#ef4444" fill-opacity="0.9"/>
  <rect x="99" y="88" width="2" height="10" rx="1" fill="#fff"/>
  <rect x="99" y="100" width="2" height="3"  rx="1" fill="#fff"/>

  <!-- Signal lines (disrupted) -->
  <path d="M180 100 Q200 85 220 100" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M185 90  Q200 72 215 90"  fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="140" y="188" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="500"
        fill="#f87171" text-anchor="middle" letter-spacing="1">CONNECTION ERROR</text>
</svg>
