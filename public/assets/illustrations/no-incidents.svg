<!-- illustrations/no-incidents.svg — green all-clear illustration -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="No incidents illustration">
  <defs>
    <linearGradient id="clear-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="280" height="200" fill="url(#clear-g)" rx="12"/>

  <!-- Sun -->
  <circle cx="220" cy="45" r="22" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="220" cy="45" r="15" fill="#fde047"/>
  <line x1="220" y1="18" x2="220" y2="10" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="72" x2="220" y2="80" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="193" y1="45" x2="185" y2="45" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="247" y1="45" x2="255" y2="45" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="25" x2="194" y2="19" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  <line x1="240" y1="65" x2="246" y2="71" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>

  <!-- Tracks -->
  <line x1="20"  y1="158" x2="260" y2="158" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
  <line x1="20"  y1="165" x2="260" y2="165" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
  <line x1="36"  y1="155" x2="36"  y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="64"  y1="155" x2="64"  y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="92"  y1="155" x2="92"  y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="120" y1="155" x2="120" y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="148" y1="155" x2="148" y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="176" y1="155" x2="176" y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="204" y1="155" x2="204" y2="168" stroke="#bbf7d0" stroke-width="2"/>
  <line x1="232" y1="155" x2="232" y2="168" stroke="#bbf7d0" stroke-width="2"/>

  <!-- Green running train -->
  <rect x="60" y="120" width="130" height="34" rx="6" fill="#22c55e"/>
  <path d="M190 122 L200 137 L190 152 Z" fill="#16a34a"/>
  <rect x="68"  y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <rect x="88"  y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <rect x="108" y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <rect x="128" y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <rect x="148" y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <rect x="168" y="126" width="14" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
  <circle cx="85"  cy="156" r="4" fill="#15803d" stroke="#86efac" stroke-width="1"/>
  <circle cx="160" cy="156" r="4" fill="#15803d" stroke="#86efac" stroke-width="1"/>

  <!-- Big checkmark badge -->
  <circle cx="100" cy="90" r="22" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="2"/>
  <circle cx="100" cy="90" r="16" fill="#22c55e"/>
  <path d="M90 90 L97 97 L112 82" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="140" y="188" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="500"
