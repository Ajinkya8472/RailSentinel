<!-- alert-icons/sensor.svg — sensor / predictive fault icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sensor alert">
  <circle cx="16" cy="16" r="13" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Radar rings -->
  <circle cx="16" cy="16" r="4"  fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="16" cy="16" r="7"  fill="none" stroke="#06b6d4" stroke-width="1"   stroke-opacity="0.25"/>
  <!-- Sensor dot -->
  <circle cx="16" cy="16" r="2.5" fill="#06b6d4"/>
  <!-- Fault spark -->
  <path d="M21 9 L19 14 L22 13 L18 21" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
